

services:
  spark-master:
    build:
      context: ./shared/spark
      dockerfile: Dockerfile
    command: bin/spark-class org.apache.spark.deploy.master.Master
    ports:
      - "8080:8080"
      - "7077:7077"
    networks:
      - data-network

  spark-worker:
    build:
      context: ./shared/spark
      dockerfile: Dockerfile
    command: bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    depends_on:
      - spark-master
    environment:
      - SPARK_WORKER_CORES=2
      - SPARK_WORKER_MEMORY=2g
    ports:
      - "8081:8081"
    networks:
      - data-network

  trino:
    image: trinodb/trino:latest
    ports:
      - "8082:8080"
    volumes:
      - ./analytics/trino/etc:/etc/trino
    networks:
      - data-network

networks:
  data-network:
    external: true